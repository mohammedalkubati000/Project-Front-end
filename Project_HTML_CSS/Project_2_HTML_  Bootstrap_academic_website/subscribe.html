<!-- صفحة الاشتراك -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>اشترك الآن</title>

    <!-- استدعاء Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body id="subscribe-page" class="bg-light">

    <!-- الهيدر الأزرق -->
    <header class="bg-primary text-white py-4 text-center mb-5 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0 fw-bold">اشترك في المنصة</h1>
            <nav>
                <a href="../index/index.html" class="btn btn-outline-light btn-sm fw-bold">الصفحة الرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="container my-4" style="max-width: 600px;">
        <section class="p-4 bg-white rounded shadow-sm border-top border-primary border-4">
            <h2 class="text-primary mb-4 h4 border-bottom pb-2 text-center">إنشاء حساب جديد</h2>
            
            <form>
                <!-- الاسم الكامل -->
                <div class="mb-3">
                    <label for="fullName" class="form-label fw-bold">الاسم الكامل:</label>
                    <input type="text" class="form-control" id="fullName" placeholder="مثال: أحمد علي">
                </div>

                <!-- البريد الإلكتروني -->
                <div class="mb-3">
                    <label for="email" class="form-label fw-bold">البريد الإلكتروني:</label>
                    <input type="email" class="form-control" id="email" placeholder="your@example.com">
                </div>

                <!-- كلمة المرور -->
                <div class="mb-3">
                    <label for="password" class="form-label fw-bold">كلمة المرور:</label>
                    <input type="password" class="form-control" id="password" placeholder="أدخل كلمة المرور">
                </div>

                <!-- تأكيد كلمة المرور -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label fw-bold">تأكيد كلمة المرور:</label>
                    <input type="password" class="form-control" id="confirmPassword" placeholder="أعد أدخل كلمة المرور">
                </div>

                <!-- زر التسجيل -->
                <button type="submit" class="btn btn-primary px-5 fw-bold w-100 py-2">اشترك الآن</button>
            </form>
        </section>
    </main>

    <!-- الفوتر -->
    <footer class="bg-primary text-white text-center py-3 mt-5">
        <p class="m-0">© 2025 الاشتراك في المنصة</p>
    </footer>

</body>
</html>
