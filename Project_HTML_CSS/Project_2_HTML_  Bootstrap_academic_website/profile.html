<!-- الملف الشخصي -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الملف الشخصي</title>

    <!-- استدعاء Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body id="profile-page" class="bg-light">

    <!-- الهيدر الأزرق -->
    <header class="bg-primary text-white py-4 text-center mb-5 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0 fw-bold">الملف الشخصي</h1>
            <nav>
                <a href="../index/index.html" class="btn btn-outline-light btn-sm fw-bold">الصفحة الرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="container my-4">
        <div class="row g-4">
            <!-- عرض بيانات المستخدم الحالي (بطاقة جانبية) -->
            <section class="col-lg-5">
                <div class="p-4 bg-white rounded shadow-sm h-100 text-center border-top border-primary border-4">
                    <h2 class="text-primary mb-4 h4">بيانات المستخدم</h2>
                    
                    <img src="https://media.licdn.com/dms/image/v2/D4D16AQEizR3fndpw5w/profile-displaybackgroundimage-shrink_200_800/profile-displaybackgroundimage-shrink_200_800/0/1723857767205?e=2147483647&v=beta&t=GgRz9EwE-_zm6CGI-n2Z7ogrDjBWiSiZhjP-Avb3Zbs" class="img-fluid rounded border mb-4 shadow-sm" style="max-height: 180px; object-fit: cover;" alt="صورة المستخدم">
                    
                    <div class="text-start bg-light p-3 rounded border">
                        <p class="mb-2"><strong>الاسم:</strong> <span class="text-secondary">محمد المحمد</span></p>
                        <p class="mb-2"><strong>البريد الإلكتروني:</strong> <span class="text-secondary">mohamed@example.com</span></p>
                        <p class="mb-0"><strong>البلد:</strong> <span class="text-secondary">السعودية</span></p>
                    </div>
                </div>
            </section>

            <!-- نموذج تحديث البيانات -->
            <section class="col-lg-7">
                <div class="p-4 bg-white rounded shadow-sm h-100 border-top border-primary border-4">
                    <h2 class="text-primary mb-4 h4">تحديث بياناتك</h2>
                    <form>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-bold">الاسم:</label>
                            <input type="text" class="form-control" id="username" value="محمد المحمد" placeholder="أدخل اسمك الجديد">
                        </div>

                        <div class="mb-3">
                            <label for="useremail" class="form-label fw-bold">البريد الإلكتروني:</label>
                            <input type="email" class="form-control" id="useremail" value="mohamed@example.com" placeholder="name@example.com">
                        </div>

                        <div class="mb-4">
                            <label for="userpassword" class="form-label fw-bold">كلمة المرور الجديدة:</label>
                            <input type="password" class="form-control" id="userpassword" placeholder="أدخل كلمة مرور جديدة">
                        </div>

                        <button type="submit" class="btn btn-primary px-4 fw-bold w-100 py-2">حفظ التغييرات</button>
                    </form>
                </div>
            </section>
        </div>
    </main>

    <!-- الفوتر -->
    <footer class="bg-primary text-white text-center py-3 mt-5">
        <p class="m-0">© 2025 أكاديمية البرمجة</p>
    </footer>

</body>
</html>
