<!-- إعدادات الحساب -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>الإعدادات</title>

    <!-- استدعاء Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body id="settings-page" class="bg-light">

    <!-- الهيدر الأزرق -->
    <header class="bg-primary text-white py-4 text-center mb-5 shadow-sm">
        <div class="container d-flex justify-content-between align-items-center">
            <h1 class="h3 m-0 fw-bold">إعدادات الحساب</h1>
            <nav>
                <a href="/Project_HTML_CSS/Project_2_HTML_  Bootstrap_academic_website/index.html" class="btn btn-outline-light btn-sm fw-bold">الصفحة الرئيسية</a>
            </nav>
        </div>
    </header>

    <main class="container my-4" style="max-width: 700px;">
        <section class="p-4 bg-white rounded shadow-sm border-top border-primary border-4">
            <h2 class="text-primary mb-4 h4 border-bottom pb-2">تفضيلات المستخدم</h2>
            <form>
                <!-- خيار القائمة المنسدلة للغة -->
                <div class="mb-4">
                    <label for="languageSelect" class="form-label fw-bold">اللغة المفضلة:</label>
                    <select class="form-select" id="languageSelect">
                        <option selected>العربية</option>
                        <option>English</option>
                    </select>
                </div>

                <!-- خيارات الإشعارات باستعمال مفاتيح التبديل (Switches) -->
                <div class="mb-4">
                    <label class="form-label fw-bold d-block mb-2">تفعيل الإشعارات:</label>
                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="emailNotif" checked>
                        <label class="form-check-label" for="emailNotif">بريد إلكتروني</label>
                    </div>
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="smsNotif">
                        <label class="form-check-label" for="smsNotif">رسائل نصية</label>
                    </div>
                </div>

                <!-- خيارات اختيار المظهر (Radio Buttons) -->
                <div class="mb-4">
                    <label class="form-label fw-bold d-block mb-2">اختيار المظهر:</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="theme" id="themeLight" checked>
                        <label class="form-check-label" for="themeLight">فاتح</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="theme" id="themeDark">
                        <label class="form-check-label" for="themeDark">داكن</label>
                    </div>
                </div>

                <!-- زر حفظ الإعدادات -->
                <button type="submit" class="btn btn-primary px-5 fw-bold w-100 py-2 mt-2">حفظ الإعدادات</button>
            </form>
        </section>
    </main>

    <!-- الفوتر -->
    <footer class="p-3 bg-primary text-white text-center fixed-bottom">
        <p class="m-0">© 2025 إعدادات الحساب - جميع الحقوق محفوظة</p>
    </footer>

</body>
</html>
